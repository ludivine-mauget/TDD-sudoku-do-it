version: '3.8'

services:
  # API Backend
  sudoku-api:
    build:
      context: .
      dockerfile: Sudoku.API/Dockerfile
    container_name: sudoku-api
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - sudoku-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Client Blazor WebAssembly
  sudoku-client:
    build:
      context: .
      dockerfile: Sudoku.Client/Dockerfile
    container_name: sudoku-client
    ports:
      - "8080:80"
    depends_on:
      - sudoku-api
    networks:
      - sudoku-network

networks:
  sudoku-network:
    driver: bridge

